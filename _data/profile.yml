short_bio: >-
  <p>
    I am a Ph.D. student in Environmental Science and Engineering at Shandong University, Qingdao, China.
    I am currently a visiting Ph.D. student in the Atmospheric Chemistry and Climate Group at the Institute
    of Physical Chemistry Rocasolano (IQFR), CSIC, Madrid, Spain.
  </p>
  <p>
    My research focuses on atmospheric chemistry, with particular interests in nitrous acid (HONO),
    reactive nitrogen chemistry, and coastal and marine atmospheric processes.
  </p>

